[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hpr-dream"
version = "0.1.0"
description = "Audit a learned simulator used as a grader against an exact oracle: attackers with exact budget accounting, cluster-bootstrap statistics, noise-only floors and the grader card."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["hpr_dream", "hpr_dream.adaptors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
